[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalmux"
version = "0.4.3"
description = "Manage many Claude Code agents running in tmux, from inside iTerm2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kalera AI" }]
keywords = ["tmux", "iterm2", "claude-code", "agents", "terminal", "cli"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
  "Topic :: Terminals :: Terminal Emulators/X Terminals",
]

[project.urls]
Homepage = "https://github.com/kalera-labs/kalmux"
Source = "https://github.com/kalera-labs/kalmux"
Issues = "https://github.com/kalera-labs/kalmux/issues"

[project.scripts]
kalmux = "kalmux._entry:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/kalmux"]

[tool.hatch.build.targets.sdist]
include = ["src/kalmux", "tests", "bin", "scripts", "README.md", "README.vi.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
# The repo's own rules, so `ruff check` says the same thing here, in CI and on a contributor's machine.
line-length = 140
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/kalmux/assets/index.html"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "BLE", "EXE", "PLW", "TRY004"]
ignore = [
  "E501",      # long lines are the house style here; `line-length` still bounds the formatter
  "SIM105",    # `contextlib.suppress` is not always clearer than a two-line try/except
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E731", "PLW0603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/kalmux"]
