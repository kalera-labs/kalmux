[project]
name = "kalmux"
version = "0.4.0"
description = "Kalmux: Claude Code state -> tmux user options + iTerm2 Session Status, the `kalmux` CLI and the iTerm2 toolbelt web UI"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["bin", "lib"]
